<style>
/* ==========================================================================
   SIPADIK - Sistem Pemutakhiran Data Peserta Didik
   SMAS PGRI 1 Banjarbaru - Design System & Modern CSS
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

:root {
  --primary: #0284c7;
  --primary-hover: #0369a1;
  --primary-light: #e0f2fe;
  --secondary: #0f172a;
  --accent: #10b981;
  --accent-light: #d1fae5;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --background: #f8fafc;
  --surface: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.04);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--background);
  color: var(--text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}

/* Header & Navbar */
.app-header {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.header-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

.brand-logo {
  width: 46px;
  height: 46px;
  object-fit: contain;
}

.brand-info h1 {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--secondary);
  letter-spacing: -0.02em;
  margin: 0;
}

.brand-info p {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 500;
}

/* Hero Section */
.hero-banner {
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 20px;
}

.hero-card {
  background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
  border-radius: var(--radius-lg);
  color: white;
  padding: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}

.hero-text {
  max-width: 600px;
  z-index: 2;
}

.hero-text h2 {
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 8px;
  line-height: 1.2;
}

.hero-text p {
  font-size: 0.95rem;
  opacity: 0.9;
  font-weight: 400;
}

.hero-image {
  height: 140px;
  object-fit: contain;
  z-index: 2;
  border-radius: var(--radius-md);
}

/* Notice Box / Banner Requirements */
.notice-box {
  max-width: 1100px;
  margin: 0 auto 24px auto;
  padding: 0 20px;
}

.alert-banner {
  background: var(--warning-light);
  border-left: 5px solid var(--warning);
  padding: 16px 20px;
  border-radius: var(--radius-md);
  display: flex;
  gap: 16px;
  align-items: flex-start;
  box-shadow: var(--shadow-sm);
}

.alert-icon {
  font-size: 1.5rem;
  color: var(--warning);
  line-height: 1;
}

.alert-content h4 {
  font-size: 0.95rem;
  font-weight: 700;
  color: #78350f;
  margin-bottom: 4px;
}

.alert-content p {
  font-size: 0.85rem;
  color: #92400e;
}

/* Main Container */
.main-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}

.form-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  padding: 32px;
}

/* Stepper Component */
.stepper-wrapper {
  margin-bottom: 35px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.stepper {
  display: flex;
  justify-content: space-between;
  position: relative;
}

.stepper::before {
  content: '';
  position: absolute;
  top: 20px;
  left: 30px;
  right: 30px;
  height: 3px;
  background: var(--border);
  z-index: 1;
}

.stepper-progress {
  position: absolute;
  top: 20px;
  left: 30px;
  height: 3px;
  background: var(--primary);
  z-index: 1;
  transition: width 0.3s ease;
  width: 0%;
}

.step-item {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  flex: 1;
}

.step-circle {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--surface);
  border: 3px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--text-muted);
  transition: all 0.3s ease;
}

.step-item.active .step-circle {
  border-color: var(--primary);
  background: var(--primary);
  color: white;
  box-shadow: 0 0 0 5px var(--primary-light);
}

.step-item.completed .step-circle {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}

.step-label {
  font-size: 0.78rem;
  font-weight: 600;
  margin-top: 8px;
  color: var(--text-muted);
  text-align: center;
}

.step-item.active .step-label {
  color: var(--primary);
  font-weight: 700;
}

/* Form Styles */
.form-step {
  display: none;
}

.form-step.active {
  display: block;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-header {
  margin-bottom: 24px;
}

.step-header h3 {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--secondary);
}

.step-header p {
  font-size: 0.88rem;
  color: var(--text-muted);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group.full-width {
  grid-column: span 2;
}

label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--secondary);
}

label .required {
  color: var(--danger);
  margin-left: 3px;
}

input[type="text"],
input[type="number"],
input[type="email"],
input[type="date"],
select,
textarea {
  width: 100%;
  padding: 12px 14px;
  font-size: 0.9rem;
  font-family: inherit;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background-color: var(--surface);
  color: var(--text-main);
  transition: all 0.2s ease;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}

input[readonly] {
  background-color: #f1f5f9;
  color: var(--text-muted);
  cursor: not-allowed;
}

/* Radio Card Group */
.radio-group {
  display: flex;
  gap: 16px;
}

.radio-card {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.radio-card:hover {
  background-color: #f8fafc;
}

.radio-card input[type="radio"] {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
}

.radio-card span {
  font-size: 0.9rem;
  font-weight: 600;
}

/* Buttons Nav */
.form-actions {
  display: flex;
  justify-content: space-between;
  margin-top: 35px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
}

.btn-secondary {
  background: #e2e8f0;
  color: var(--secondary);
}

.btn-secondary:hover {
  background: #cbd5e1;
}

.btn-primary {
  background: var(--primary);
  color: white;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-success {
  background: var(--accent);
  color: white;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

.btn-success:hover {
  background: #059669;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Modal System */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  max-width: 550px;
  width: 90%;
  padding: 28px;
  box-shadow: var(--shadow-lg);
  transform: scale(0.95);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal-card {
  transform: scale(1);
}

.modal-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--secondary);
  margin-bottom: 12px;
}

.modal-body {
  font-size: 0.9rem;
  color: var(--text-main);
  margin-bottom: 24px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

/* Status Badges */
.badge {
  display: inline-block;
  padding: 4px 10px;
  font-size: 0.75rem;
  font-weight: 700;
  border-radius: 20px;
  text-align: center;
}

.badge-pending {
  background: var(--warning-light);
  color: #b45309;
}

.badge-success {
  background: var(--accent-light);
  color: #047857;
}

/* Admin Dashboard Table */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.stat-title {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
}

.stat-value {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--secondary);
  margin-top: 4px;
}

.table-wrapper {
  overflow-x: auto;
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

table.data-table th,
table.data-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

table.data-table th {
  background: #f1f5f9;
  font-weight: 700;
  color: var(--secondary);
  white-space: nowrap;
}

table.data-table tr:hover {
  background-color: #f8fafc;
}

/* Footer */
footer {
  text-align: center;
  margin-top: 40px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

/* Flatpickr Custom Styling Overrides */
.flatpickr-calendar {
  border-radius: var(--radius-md) !important;
  box-shadow: var(--shadow-lg) !important;
  border: 1px solid var(--border) !important;
  font-family: inherit !important;
}

.flatpickr-day.selected, .flatpickr-day.selected:hover, .flatpickr-day.selected:focus {
  background: var(--primary) !important;
  border-color: var(--primary) !important;
}

.flatpickr-months .flatpickr-month {
  background: var(--secondary) !important;
  color: white !important;
}

.flatpickr-current-month .flatpickr-monthDropdown-months,
.flatpickr-current-month input.cur-year {
  font-weight: 700 !important;
}

/* Responsive Rules */
@media (max-width: 768px) {
  .hero-card {
    flex-direction: column;
    text-align: center;
    gap: 16px;
  }
  
  .hero-image {
    height: 100px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }
  
  .form-group.full-width {
    grid-column: span 1;
  }

  .stepper-wrapper {
    overflow-x: auto;
  }

  .step-label {
    font-size: 0.7rem;
  }

  .dashboard-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
